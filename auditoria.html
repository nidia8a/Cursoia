<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría ISO 39001 - App</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Chart.js para la gráfica Radar -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        .mic-pulse { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        @media print {
            .no-print { display: none !important; }
            .print-break-inside-avoid { break-inside: avoid; }
            .shadow-2xl { box-shadow: none !important; }
            body { background: white; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONOS SVG (Inline para evitar dependencias) ---
        const Icons = {
            ClipboardCheck: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>,
            Mic: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>,
            MicOff: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></svg>,
            CheckCircle: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            XCircle: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>,
            MinusCircle: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>,
            ArrowRight: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>,
            Printer: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>,
            Building: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/></svg>,
            User: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            MapPin: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>,
            Calendar: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            Wand2: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m19 2 2 2-2 2-2-2 2-2Z"/><path d="m5 17 2 2-2 2-2-2 2-2Z"/><path d="m15 4 5 5"/><path d="M4 15l11-11 5 5-11 11-5 5 0-5Z"/></svg>,
            Play: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        };

        // --- DATOS INICIALES ---
        const INITIAL_SECTIONS = [
          {
            id: 'context',
            title: '4. Contexto',
            questions: [
              { id: '4.1', text: '¿Se han identificado factores internos/externos (vías, horarios) que afectan la seguridad vial?', compliance: null, obs: '' },
              { id: '4.2', text: '¿Se han determinado las partes interesadas (conductores, vecinos, autoridades) y sus requisitos?', compliance: null, obs: '' },
              { id: '4.3', text: '¿El alcance del SGSV incluye explícitamente carga, descarga y transporte?', compliance: null, obs: '' }
            ]
          },
          {
            id: 'leadership',
            title: '5. Liderazgo',
            questions: [
              { id: '5.2', text: '¿Existe Política de Seguridad Vial firmada y comunicada?', compliance: null, obs: '' },
              { id: '5.3', text: '¿Están definidos los roles (Jefe de Patio, Supervisor de Tráfico)?', compliance: null, obs: '' }
            ]
          },
          {
            id: 'planning',
            title: '6. Planificación',
            questions: [
              { id: '6.2', text: '¿Identificados riesgos en patios (atropellos, puntos ciegos)?', compliance: null, obs: '' },
              { id: '6.4', text: '¿Existen objetivos medibles (ej. reducir daños en reversa)?', compliance: null, obs: '' }
            ]
          },
          {
            id: 'support',
            title: '7. Soporte',
            questions: [
              { id: '7.2', text: '¿Personal competente (licencias, cursos manejo defensivo)?', compliance: null, obs: '' },
              { id: '7.5', text: '¿Información documentada disponible en puntos de uso?', compliance: null, obs: '' }
            ]
          },
          {
            id: 'operation',
            title: '8. Operación',
            questions: [
              { id: '8.1a', text: '¿Vías peatones/vehículos segregadas y señalizadas?', compliance: null, obs: '' },
              { id: '8.1b', text: '¿Inspección pre-operacional (checklist) rigurosa?', compliance: null, obs: '' },
              { id: '8.1c', text: '¿Protocolos de estiba y aseguramiento de carga aplicados?', compliance: null, obs: '' },
              { id: '8.1d', text: '¿Control de velocidad en recinto (radares/reductores)?', compliance: null, obs: '' },
              { id: '8.2', text: '¿Plan de respuesta a emergencias viales probado?', compliance: null, obs: '' }
            ]
          },
          {
            id: 'evaluation',
            title: '9. Evaluación',
            questions: [
              { id: '9.1', text: '¿Investigación de todos los incidentes (incluyendo casi-accidentes)?', compliance: null, obs: '' },
              { id: '9.2', text: '¿Auditorías internas realizadas a intervalos planificados?', compliance: null, obs: '' }
            ]
          },
          {
            id: 'improvement',
            title: '10. Mejora',
            questions: [
              { id: '10.1', text: '¿Gestión de No Conformidades y acciones correctivas eficaces?', compliance: null, obs: '' },
              { id: '10.2', text: '¿Evidencia de mejora continua en indicadores viales?', compliance: null, obs: '' }
            ]
          }
        ];

        // --- COMPONENTE CHART.JS WRAPPER ---
        const RadarChartComponent = ({ data }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = chartRef.current.getContext('2d');
                
                chartInstance.current = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: data.map(d => d.subject),
                        datasets: [{
                            label: 'Cumplimiento (%)',
                            data: data.map(d => d.A),
                            backgroundColor: 'rgba(59, 130, 246, 0.5)',
                            borderColor: 'rgb(37, 99, 235)',
                            pointBackgroundColor: 'rgb(37, 99, 235)',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        scales: {
                            r: {
                                angleLines: { color: '#cbd5e1' },
                                grid: { color: '#cbd5e1' },
                                pointLabels: { font: { size: 12, weight: 'bold' }, color: '#334155' },
                                suggestedMin: 0,
                                suggestedMax: 100,
                                ticks: { stepSize: 20, backdropColor: 'transparent' }
                            }
                        },
                        plugins: {
                            legend: { display: false }
                        },
                        responsive: true,
                        maintainAspectRatio: false
                    }
                });

                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                }
            }, [data]);

            return <canvas ref={chartRef} />;
        };

        // --- COMPONENTE PRINCIPAL APP ---
        function ISOAuditApp() {
            const [view, setView] = useState('setup'); // setup, audit, report
            const [metadata, setMetadata] = useState({
                companyName: '',
                auditorName: '',
                auditedName: '',
                date: new Date().toISOString().split('T')[0],
                location: '',
                criteria: 'Norma ISO 39001:2012 - Gestión de la Seguridad Vial'
            });
            const [sections, setSections] = useState(INITIAL_SECTIONS);
            const [activeSectionIndex, setActiveSectionIndex] = useState(0);
            const [isListening, setIsListening] = useState(false);
            const [listeningQuestionId, setListeningQuestionId] = useState(null);
            
            const recognitionRef = useRef(null);

            // Inicializar Voz
            useEffect(() => {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    recognitionRef.current = new SpeechRecognition();
                    recognitionRef.current.continuous = false;
                    recognitionRef.current.lang = 'es-ES';
                    recognitionRef.current.interimResults = false;

                    recognitionRef.current.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        if (listeningQuestionId) {
                            updateObservation(listeningQuestionId, transcript, true);
                        }
                        setIsListening(false);
                        setListeningQuestionId(null);
                    };

                    recognitionRef.current.onerror = (event) => {
                        console.error('Error voz', event);
                        setIsListening(false);
                        setListeningQuestionId(null);
                    };
                    recognitionRef.current.onend = () => {
                        setIsListening(false);
                        setListeningQuestionId(null);
                    };
                }
            }, [listeningQuestionId, sections]);

            const handleMetadataChange = (e) => {
                setMetadata({ ...metadata, [e.target.name]: e.target.value });
            };

            const handleScore = (sectionId, questionId, score) => {
                setSections(prev => prev.map(sec => {
                    if (sec.id !== sectionId) return sec;
                    return {
                        ...sec,
                        questions: sec.questions.map(q => 
                            q.id === questionId ? { ...q, compliance: score } : q
                        )
                    };
                }));
            };

            const updateObservation = (questionId, text, append = false) => {
                setSections(prev => prev.map(sec => ({
                    ...sec,
                    questions: sec.questions.map(q => {
                        if (q.id === questionId) {
                            const newText = append && q.obs ? `${q.obs} ${text}` : text;
                            return { ...q, obs: newText };
                        }
                        return q;
                    })
                })));
            };

            const loadDemoData = () => {
                setMetadata({
                    companyName: 'Transportes Logísticos del Norte SAS',
                    auditorName: 'Ing. María González',
                    auditedName: 'Carlos Pérez - Jefe de Operaciones',
                    date: new Date().toISOString().split('T')[0],
                    location: 'Centro de Distribución Zona Franca',
                    criteria: 'Norma ISO 39001:2012'
                });

                const demoSections = sections.map(sec => ({
                    ...sec,
                    questions: sec.questions.map(q => {
                        const rand = Math.random();
                        let status = 'yes';
                        let obs = 'Evidencia de Conformidad: Se verifica mediante registros documentales y observación en campo.';
                        
                        if (rand < 0.3) {
                            status = 'no';
                            obs = 'Hallazgo de No Conformidad: No se evidencia registro actualizado de este requisito.';
                        } else if (rand < 0.4) {
                            status = 'na';
                            obs = 'Justificación de Exclusión: Este proceso es tercerizado.';
                        }

                        return { ...q, compliance: status, obs: obs };
                    })
                }));

                setSections(demoSections);
                setView('report');
            };

            const toggleRecording = (questionId) => {
                if (isListening) {
                    recognitionRef.current.stop();
                } else {
                    if (recognitionRef.current) {
                        setListeningQuestionId(questionId);
                        setIsListening(true);
                        recognitionRef.current.start();
                    } else {
                        alert("Navegador no compatible con voz.");
                    }
                }
            };

            const formatObservationISO19011 = (sectionId, questionId) => {
                setSections(prev => prev.map(sec => {
                    if (sec.id !== sectionId) return sec;
                    return {
                        ...sec,
                        questions: sec.questions.map(q => {
                            if (q.id !== questionId || !q.obs) return q;
                            
                            let formatted = q.obs;
                            const lower = formatted.toLowerCase();
                            
                            if (q.compliance === 'no' && !lower.includes('hallazgo')) {
                                formatted = `Hallazgo de No Conformidad: Se evidencia que ${lower.replace(/^\s+/g, '')}. Esto incumple el requisito del numeral ${q.id}.`;
                            } else if (q.compliance === 'yes' && !lower.includes('evidencia')) {
                                formatted = `Evidencia de Conformidad: Se verifica mediante inspección visual y documental que ${lower.replace(/^\s+/g, '')}.`;
                            } else if (q.compliance === 'na' && !lower.includes('justificación')) {
                                formatted = `Justificación de Exclusión: ${formatted}`;
                            }
                            
                            return { ...q, obs: formatted };
                        })
                    };
                }));
            };

            const calculateStats = () => {
                return sections.map(sec => {
                    const total = sec.questions.length;
                    const yes = sec.questions.filter(q => q.compliance === 'yes').length;
                    const na = sec.questions.filter(q => q.compliance === 'na').length;
                    const applicable = total - na;
                    const score = applicable > 0 ? Math.round((yes / applicable) * 100) : 100;
                    
                    return {
                        subject: sec.title.split('. ')[1],
                        A: score
                    };
                });
            };

            const getOverallScore = () => {
                let totalYes = 0;
                let totalApplicable = 0;
                sections.forEach(sec => {
                    sec.questions.forEach(q => {
                        if (q.compliance === 'yes') totalYes++;
                        if (q.compliance !== 'na' && q.compliance !== null) totalApplicable++;
                    });
                });
                return totalApplicable > 0 ? Math.round((totalYes / totalApplicable) * 100) : 0;
            };

            // --- VISTAS ---

            const SetupView = () => (
                <div className="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-2xl mt-10 border-t-4 border-blue-600">
                    <div className="text-center mb-8">
                        <div className="flex justify-center mb-4 text-blue-600"><Icons.ClipboardCheck className="w-16 h-16" /></div>
                        <h1 className="text-3xl font-bold text-slate-800">Auditoría ISO 39001</h1>
                        <p className="text-slate-500">Gestión de Seguridad Vial - Logística y Almacén</p>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">Empresa Auditada</label>
                            <div className="relative">
                                <div className="absolute left-3 top-3 w-5 h-5 text-slate-400"><Icons.Building className="w-5 h-5" /></div>
                                <input type="text" name="companyName" value={metadata.companyName} onChange={handleMetadataChange} 
                                    className="pl-10 w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej. Logística Express SAS" />
                            </div>
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">Fecha</label>
                            <div className="relative">
                                <div className="absolute left-3 top-3 w-5 h-5 text-slate-400"><Icons.Calendar className="w-5 h-5" /></div>
                                <input type="date" name="date" value={metadata.date} onChange={handleMetadataChange} 
                                    className="pl-10 w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                            </div>
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">Auditor Líder</label>
                            <div className="relative">
                                <div className="absolute left-3 top-3 w-5 h-5 text-slate-400"><Icons.User className="w-5 h-5" /></div>
                                <input type="text" name="auditorName" value={metadata.auditorName} onChange={handleMetadataChange} 
                                    className="pl-10 w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Tu Nombre" />
                            </div>
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">Responsable Auditado</label>
                            <div className="relative">
                                <div className="absolute left-3 top-3 w-5 h-5 text-slate-400"><Icons.User className="w-5 h-5" /></div>
                                <input type="text" name="auditedName" value={metadata.auditedName} onChange={handleMetadataChange} 
                                    className="pl-10 w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nombre del Encargado" />
                            </div>
                        </div>
                        <div className="md:col-span-2">
                            <label className="block text-sm font-medium text-slate-700 mb-1">Lugar / Sede</label>
                            <div className="relative">
                                <div className="absolute left-3 top-3 w-5 h-5 text-slate-400"><Icons.MapPin className="w-5 h-5" /></div>
                                <input type="text" name="location" value={metadata.location} onChange={handleMetadataChange} 
                                    className="pl-10 w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej. Centro de Distribución Norte" />
                            </div>
                        </div>
                    </div>

                    <div className="flex flex-col md:flex-row gap-4 mt-8">
                        <button 
                            onClick={loadDemoData}
                            className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-4 rounded-lg font-bold text-lg flex items-center justify-center transition-all shadow-md border border-slate-300"
                        >
                            <div className="mr-2"><Icons.Play className="w-5 h-5" /></div> Modo Demo
                        </button>
                        <button 
                            onClick={() => setView('audit')}
                            disabled={!metadata.companyName || !metadata.auditorName}
                            className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-lg font-bold text-lg flex items-center justify-center transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-lg hover:shadow-xl"
                        >
                            Iniciar Auditoría <div className="ml-2"><Icons.ArrowRight className="w-6 h-6" /></div>
                        </button>
                    </div>
                </div>
            );

            const AuditView = () => {
                const currentSection = sections[activeSectionIndex];
                
                return (
                    <div className="max-w-5xl mx-auto pb-20 pt-4">
                        <div className="bg-white sticky top-0 z-10 shadow-md p-4 mb-6 rounded-xl flex justify-between items-center">
                            <div>
                                <h2 className="text-xl font-bold text-slate-800">{currentSection.title}</h2>
                                <p className="text-sm text-slate-500">Sección {activeSectionIndex + 1} de {sections.length}</p>
                            </div>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => setActiveSectionIndex(prev => Math.max(0, prev - 1))}
                                    disabled={activeSectionIndex === 0}
                                    className="p-2 rounded-full hover:bg-slate-100 disabled:opacity-30 transition-colors text-sm font-bold"
                                >
                                    Anterior
                                </button>
                                {activeSectionIndex < sections.length - 1 ? (
                                    <button 
                                        onClick={() => setActiveSectionIndex(prev => Math.min(sections.length - 1, prev + 1))}
                                        className="bg-blue-600 text-white px-6 py-2 rounded-full font-medium hover:bg-blue-700 transition-colors shadow-md"
                                    >
                                        Siguiente
                                    </button>
                                ) : (
                                    <button 
                                        onClick={() => setView('report')}
                                        className="bg-emerald-600 text-white px-6 py-2 rounded-full font-bold hover:bg-emerald-700 transition-colors shadow-md flex items-center animate-pulse"
                                    >
                                        Finalizar <div className="ml-2"><Icons.ClipboardCheck className="w-4 h-4" /></div>
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="space-y-6 px-4">
                            {currentSection.questions.map(q => (
                                <div key={q.id} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden transition-all hover:shadow-md">
                                    <div className="p-6">
                                        <div className="flex flex-col md:flex-row justify-between items-start mb-4">
                                            <div className="pr-4 mb-4 md:mb-0">
                                                <span className="inline-block px-2 py-1 bg-slate-100 text-slate-600 text-xs font-bold rounded mb-2">Req. {q.id}</span>
                                                <h3 className="text-lg font-medium text-slate-800 leading-snug">{q.text}</h3>
                                            </div>
                                            <div className="flex gap-2 shrink-0">
                                                <button 
                                                    onClick={() => handleScore(currentSection.id, q.id, 'yes')}
                                                    className={`flex flex-col items-center p-2 rounded-lg w-20 border-2 transition-all ${q.compliance === 'yes' ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-transparent hover:bg-slate-50 text-slate-400'}`}
                                                >
                                                    <div className="mb-1"><Icons.CheckCircle className={`w-8 h-8 ${q.compliance === 'yes' ? 'fill-emerald-500 text-white' : ''}`} /></div>
                                                    <span className="text-xs font-bold">Cumple</span>
                                                </button>
                                                <button 
                                                    onClick={() => handleScore(currentSection.id, q.id, 'no')}
                                                    className={`flex flex-col items-center p-2 rounded-lg w-20 border-2 transition-all ${q.compliance === 'no' ? 'border-red-500 bg-red-50 text-red-700' : 'border-transparent hover:bg-slate-50 text-slate-400'}`}
                                                >
                                                    <div className="mb-1"><Icons.XCircle className={`w-8 h-8 ${q.compliance === 'no' ? 'fill-red-500 text-white' : ''}`} /></div>
                                                    <span className="text-xs font-bold">No Cumple</span>
                                                </button>
                                                <button 
                                                    onClick={() => handleScore(currentSection.id, q.id, 'na')}
                                                    className={`flex flex-col items-center p-2 rounded-lg w-20 border-2 transition-all ${q.compliance === 'na' ? 'border-slate-400 bg-slate-50 text-slate-700' : 'border-transparent hover:bg-slate-50 text-slate-400'}`}
                                                >
                                                    <div className="mb-1"><Icons.MinusCircle className={`w-8 h-8 ${q.compliance === 'na' ? 'fill-slate-400 text-white' : ''}`} /></div>
                                                    <span className="text-xs font-bold">N/A</span>
                                                </button>
                                            </div>
                                        </div>

                                        <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                            <div className="flex justify-between items-center mb-2">
                                                <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">Evidencias / Hallazgos</label>
                                                <div className="flex gap-2">
                                                    <button 
                                                        onClick={() => formatObservationISO19011(currentSection.id, q.id)}
                                                        disabled={!q.obs}
                                                        className="flex items-center text-xs text-purple-600 hover:text-purple-800 disabled:opacity-50"
                                                        title="Mejorar redacción a norma ISO 19011"
                                                    >
                                                        <div className="mr-1"><Icons.Wand2 className="w-3 h-3" /></div> Redacción ISO
                                                    </button>
                                                    <button 
                                                        onClick={() => toggleRecording(q.id)}
                                                        className={`flex items-center text-xs font-bold transition-colors ${listeningQuestionId === q.id ? 'text-red-600 animate-pulse' : 'text-blue-600 hover:text-blue-800'}`}
                                                    >
                                                        {listeningQuestionId === q.id ? (
                                                            <><div className="mr-1"><Icons.MicOff className="w-3 h-3" /></div> Detener</>
                                                        ) : (
                                                            <><div className="mr-1"><Icons.Mic className="w-3 h-3" /></div> Dictar</>
                                                        )}
                                                    </button>
                                                </div>
                                            </div>
                                            <textarea 
                                                className="w-full p-3 text-sm text-slate-700 bg-white border border-slate-200 rounded-md focus:ring-2 focus:ring-blue-200 outline-none transition-all"
                                                rows="3"
                                                placeholder="Escribe o dicta los detalles del hallazgo..."
                                                value={q.obs}
                                                onChange={(e) => updateObservation(q.id, e.target.value)}
                                            />
                                            {listeningQuestionId === q.id && (
                                                <div className="mt-2 text-xs text-red-500 font-medium animate-pulse">
                                                    Escuchando... (Habla claro)
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const ReportView = () => {
                const stats = calculateStats();
                const overall = getOverallScore();

                return (
                    <div className="max-w-4xl mx-auto bg-white shadow-2xl min-h-screen print:shadow-none print:w-full">
                        <div className="p-4 flex justify-between bg-slate-800 text-white no-print">
                            <button onClick={() => setView('audit')} className="flex items-center hover:text-blue-300">
                                <div className="mr-2 rotate-180"><Icons.ArrowRight className="w-4 h-4" /></div> Volver
                            </button>
                            <div className="flex gap-3">
                                <button onClick={() => window.print()} className="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded flex items-center font-bold transition-colors">
                                    <div className="mr-2"><Icons.Printer className="w-4 h-4" /></div> Imprimir / PDF
                                </button>
                            </div>
                        </div>

                        <div className="p-10 print:p-0">
                            <div className="border-b-2 border-slate-800 pb-6 mb-8 flex justify-between items-end">
                                <div>
                                    <h1 className="text-4xl font-bold text-slate-900 mb-2">Informe de Auditoría</h1>
                                    <h2 className="text-xl text-slate-600 font-light">Norma ISO 39001:2012</h2>
                                </div>
                                <div className="text-right">
                                    <div className={`text-5xl font-bold mb-1 ${overall >= 80 ? 'text-emerald-600' : overall >= 60 ? 'text-amber-500' : 'text-red-600'}`}>
                                        {overall}%
                                    </div>
                                    <div className="text-sm text-slate-500 uppercase tracking-wide">Cumplimiento General</div>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-6 mb-10 bg-slate-50 p-6 rounded-lg print:bg-transparent print:p-0 print:border print:border-slate-200">
                                <div>
                                    <p className="text-xs text-slate-400 uppercase">Empresa Auditada</p>
                                    <p className="font-bold text-slate-800 text-lg">{metadata.companyName}</p>
                                </div>
                                <div>
                                    <p className="text-xs text-slate-400 uppercase">Fecha de Auditoría</p>
                                    <p className="font-bold text-slate-800 text-lg">{metadata.date}</p>
                                </div>
                                <div>
                                    <p className="text-xs text-slate-400 uppercase">Auditor Líder</p>
                                    <p className="font-bold text-slate-800">{metadata.auditorName}</p>
                                </div>
                                <div>
                                    <p className="text-xs text-slate-400 uppercase">Ubicación / Sede</p>
                                    <p className="font-bold text-slate-800">{metadata.location}</p>
                                </div>
                            </div>

                            <div className="mb-12 flex flex-col items-center print-break-inside-avoid">
                                <h3 className="text-lg font-bold text-slate-700 mb-4 w-full border-l-4 border-blue-600 pl-3">Resumen de Desempeño</h3>
                                <div style={{ height: '400px', width: '100%' }}>
                                    <RadarChartComponent data={stats} />
                                </div>
                            </div>

                            <div className="space-y-8 print-break-inside-avoid">
                                <h3 className="text-lg font-bold text-slate-700 w-full border-l-4 border-blue-600 pl-3">Detalle de Hallazgos</h3>
                                
                                {sections.map(sec => {
                                    const relevantQuestions = sec.questions.filter(q => q.compliance !== null || q.obs !== '');
                                    if (relevantQuestions.length === 0) return null;

                                    return (
                                        <div key={sec.id} className="mb-6 break-inside-avoid">
                                            <h4 className="font-bold text-slate-800 mb-3 border-b border-slate-200 pb-1">{sec.title}</h4>
                                            <table className="w-full text-sm text-left text-slate-600">
                                                <thead className="text-xs text-slate-700 uppercase bg-slate-100">
                                                    <tr>
                                                        <th className="px-4 py-2 w-16">Req.</th>
                                                        <th className="px-4 py-2">Requisito</th>
                                                        <th className="px-4 py-2 w-24 text-center">Estado</th>
                                                        <th className="px-4 py-2 w-1/2">Observaciones</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {relevantQuestions.map(q => (
                                                        <tr key={q.id} className="border-b border-slate-100 hover:bg-slate-50">
                                                            <td className="px-4 py-3 font-medium">{q.id}</td>
                                                            <td className="px-4 py-3">{q.text}</td>
                                                            <td className="px-4 py-3 text-center">
                                                                {q.compliance === 'yes' && <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-2 py-1 rounded-full">Conforme</span>}
                                                                {q.compliance === 'no' && <span className="bg-red-100 text-red-800 text-xs font-bold px-2 py-1 rounded-full">No Conf.</span>}
                                                                {q.compliance === 'na' && <span className="bg-slate-100 text-slate-600 text-xs font-bold px-2 py-1 rounded-full">N/A</span>}
                                                            </td>
                                                            <td className="px-4 py-3 italic text-slate-500">
                                                                {q.obs || <span className="text-slate-300">Sin observaciones registradas.</span>}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )
                                })}
                            </div>
                            
                            <div className="mt-20 grid grid-cols-2 gap-20 print-break-inside-avoid">
                                <div className="border-t border-slate-400 pt-4 text-center">
                                    <p className="font-bold text-slate-800">{metadata.auditorName}</p>
                                    <p className="text-sm text-slate-500">Firma Auditor Líder</p>
                                </div>
                                <div className="border-t border-slate-400 pt-4 text-center">
                                    <p className="font-bold text-slate-800">{metadata.auditedName}</p>
                                    <p className="text-sm text-slate-500">Firma Auditado (Revisado)</p>
                                </div>
                            </div>

                            <div className="mt-10 text-center text-xs text-slate-400 print:fixed print:bottom-4 print:w-full">
                                Generado por ISO 39001 Audit App - {new Date().toLocaleDateString()}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-100 font-sans text-slate-900 print:bg-white">
                    <nav className="bg-slate-900 text-white p-4 shadow-lg no-print">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <Icons.ClipboardCheck className="w-6 h-6 text-blue-400" />
                                <span className="font-bold text-lg">ISO Audit <span className="font-light text-blue-300">Pro</span></span>
                            </div>
                            <div className="text-xs text-slate-400 hidden md:block">
                                {metadata.companyName ? `Auditando: ${metadata.companyName}` : 'Nueva Auditoría'}
                            </div>
                        </div>
                    </nav>

                    <main className="p-4 print:p-0">
                        {view === 'setup' && <SetupView />}
                        {view === 'audit' && <AuditView />}
                        {view === 'report' && <ReportView />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ISOAuditApp />);
    </script>
</body>
</html>
